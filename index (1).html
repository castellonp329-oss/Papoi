<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Hot Wheels Universe</title>

<meta
    name="theme-color"
    content="#02030c"
>

<meta
    name="description"
    content="Hot Wheels Universe - Feliz Día de los Hot Wheels"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030c;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    touch-action:none;
}


/* =========================================================
   CANVAS
========================================================= */

#canvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:block;

}


/* =========================================================
   CINEMATIC INTRO
========================================================= */

#intro{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    pointer-events:none;

    background:

        radial-gradient(
            circle at center,
            rgba(10,80,180,.15),
            rgba(0,0,0,.98) 65%
        );

    transition:
        opacity 1.4s ease,
        visibility 1.4s ease;

}


#intro.hidden{

    opacity:0;

    visibility:hidden;

}


.introLogo{

    font-size:
        clamp(
            38px,
            9vw,
            100px
        );

    font-weight:1000;

    font-style:italic;

    letter-spacing:-5px;

    color:#fff;

    text-shadow:

        0 0 5px #fff,

        0 0 15px #00aaff,

        0 0 35px #008cff,

        0 0 70px #006eff;

    animation:

        logoIn 1.7s
        cubic-bezier(.17,.67,.2,1)
        forwards;

}


.introSubtitle{

    margin-top:12px;

    font-size:
        clamp(
            14px,
            3vw,
            28px
        );

    letter-spacing:
        clamp(
            5px,
            2vw,
            14px
        );

    color:#53c8ff;

    opacity:0;

    animation:

        subtitleIn
        1.5s
        1s
        ease
        forwards;

}


.introLine{

    width:min(
        360px,
        65vw
    );

    height:2px;

    margin-top:28px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #00aaff,
            #fff,
            #00aaff,
            transparent
        );

    box-shadow:
        0 0 15px #008cff;

    transform:scaleX(0);

    animation:

        lineIn
        1.3s
        1.2s
        ease
        forwards;

}


@keyframes logoIn{

    from{

        opacity:0;

        transform:
            scale(.5)
            translateY(30px);

        filter:blur(15px);

    }

    to{

        opacity:1;

        transform:
            scale(1)
            translateY(0);

        filter:blur(0);

    }

}


@keyframes subtitleIn{

    to{

        opacity:1;

    }

}


@keyframes lineIn{

    to{

        transform:scaleX(1);

    }

}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:fixed;

    z-index:101;

    left:50%;

    bottom:12%;

    transform:
        translateX(-50%);

    width:min(
        340px,
        75vw
    );

    text-align:center;

    transition:
        opacity .7s ease;

}


.loadingText{

    font-size:12px;

    letter-spacing:4px;

    color:#8adfff;

    margin-bottom:10px;

}


.loadingBar{

    width:100%;

    height:3px;

    background:
        rgba(255,255,255,.08);

    overflow:hidden;

    border-radius:20px;

}


.loadingProgress{

    width:0%;

    height:100%;

    background:

        linear-gradient(
            90deg,
            #0077ff,
            #00d9ff,
            white
        );

    box-shadow:
        0 0 15px #00bfff;

    transition:
        width .25s ease;

}


/* =========================================================
   HUD
========================================================= */

#hud{

    position:fixed;

    inset:0;

    z-index:20;

    pointer-events:none;

}


.hudTop{

    position:absolute;

    top:25px;

    left:25px;

    right:25px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

}


.brand{

    pointer-events:none;

}


.brandMain{

    font-size:
        clamp(
            24px,
            5vw,
            52px
        );

    font-weight:1000;

    font-style:italic;

    letter-spacing:-2px;

    color:white;

    text-shadow:

        0 0 5px white,

        0 0 20px #008cff,

        0 0 40px #0066ff;

}


.brandSub{

    margin-top:4px;

    color:#4bc9ff;

    font-size:
        clamp(
            9px,
            1.8vw,
            14px
        );

    letter-spacing:
        clamp(
            4px,
            1vw,
            9px
        );

}


.buttons{

    display:flex;

    gap:8px;

    pointer-events:auto;

}


.hudButton{

    border:
        1px solid
        rgba(0,174,255,.55);

    background:
        rgba(0,10,30,.55);

    color:#bceeff;

    padding:
        9px 13px;

    border-radius:7px;

    font-size:11px;

    letter-spacing:1px;

    cursor:pointer;

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 0 15px
        rgba(0,130,255,.12);

    transition:
        .25s ease;

}


.hudButton:hover{

    background:
        rgba(0,120,255,.2);

    color:white;

    border-color:
        #00bfff;

    box-shadow:
        0 0 20px
        rgba(0,160,255,.4);

}


/* =========================================================
   CENTER TITLE
========================================================= */

#title{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    pointer-events:none;

    width:100%;

}


.titleSmall{

    font-size:
        clamp(
            10px,
            2vw,
            18px
        );

    letter-spacing:
        clamp(
            5px,
            2vw,
            13px
        );

    color:#5acfff;

    text-shadow:
        0 0 15px #008cff;

    opacity:.8;

}


.titleBig{

    margin-top:7px;

    font-size:
        clamp(
            35px,
            9vw,
            100px
        );

    font-weight:1000;

    font-style:italic;

    color:white;

    text-shadow:

        0 0 5px white,

        0 0 20px #00aaff,

        0 0 50px #0066ff,

        0 0 100px #003cff;

    opacity:.93;

}


/* =========================================================
   SELECTED CAR PANEL
========================================================= */

#selection{

    position:absolute;

    right:25px;

    bottom:25px;

    width:
        min(
            290px,
            calc(100vw - 50px)
        );

    padding:17px;

    border:
        1px solid
        rgba(0,170,255,.4);

    border-radius:12px;

    background:

        linear-gradient(
            135deg,
            rgba(2,12,35,.88),
            rgba(0,0,12,.65)
        );

    backdrop-filter:
        blur(15px);

    box-shadow:

        0 0 35px
        rgba(0,120,255,.14);

    transform:
        translateY(20px);

    opacity:0;

    pointer-events:none;

    transition:
        .35s ease;

}


#selection.show{

    opacity:1;

    transform:
        translateY(0);

}


.selectionLabel{

    color:#42c8ff;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:6px;

}


.selectionName{

    font-size:25px;

    font-weight:900;

    font-style:italic;

    text-transform:uppercase;

    text-shadow:
        0 0 15px
        rgba(0,170,255,.7);

}


.selectionType{

    color:#9dbbd0;

    font-size:11px;

    margin-top:5px;

}


.selectionHint{

    color:#526b7c;

    font-size:9px;

    margin-top:14px;

    letter-spacing:1px;

}


/* =========================================================
   INSTRUCTIONS
========================================================= */

#instructions{

    position:absolute;

    left:50%;

    bottom:24px;

    transform:
        translateX(-50%);

    color:
        rgba(180,220,240,.45);

    font-size:9px;

    letter-spacing:2px;

    pointer-events:none;

    text-align:center;

}


/* =========================================================
   ERROR SCREEN
========================================================= */

#error{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:30px;

    background:#02030c;

    text-align:center;

}


.errorBox{

    max-width:600px;

    border:
        1px solid
        rgba(0,170,255,.4);

    border-radius:15px;

    padding:25px;

    background:
        rgba(0,20,40,.8);

    box-shadow:
        0 0 40px
        rgba(0,100,255,.2);

}


.errorTitle{

    color:#5bd5ff;

    font-size:25px;

    font-weight:bold;

    margin-bottom:12px;

}


.errorText{

    color:#9db8c8;

    font-size:13px;

    line-height:1.6;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .hudTop{

        top:15px;

        left:15px;

        right:15px;

    }

    .buttons{

        flex-direction:column;

        align-items:flex-end;

    }

    #selection{

        right:15px;

        bottom:15px;

    }

    #instructions{

        display:none;

    }

}

</style>
</head>

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const canvas =
    document.getElementById("canvas");

const intro =
    document.getElementById("intro");

const loading =
    document.getElementById("loading");

const loadingProgress =
    document.getElementById("loadingProgress");

const errorScreen =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");

const selection =
    document.getElementById("selection");

const selectionName =
    document.getElementById("selectionName");

const selectionType =
    document.getElementById("selectionType");

const autoButton =
    document.getElementById("autoButton");

const resetButton =
    document.getElementById("resetButton");


/* =========================================================
   ESCENA
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x01020a
    );

scene.fog =
    new THREE.FogExp2(
        0x020718,
        0.00085
    );


/* =========================================================
   CÁMARA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        0.1,

        5000

    );


camera.position.set(
    0,
    85,
    260
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas,

        antialias:true,

        alpha:false,

        powerPreference:
            "high-performance"

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1.25;


/* =========================================================
   CONTROLES
========================================================= */

const controls =
    new OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;

controls.dampingFactor =
    .055;

controls.minDistance =
    80;

controls.maxDistance =
    800;

controls.target.set(
    0,
    0,
    0
);


/* =========================================================
   ILUMINACIÓN
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0x4c83b5,
        1.4
    );

scene.add(
    ambient
);


const blueLight =
    new THREE.PointLight(
        0x008cff,
        220,
        900
    );

blueLight.position.set(
    0,
    40,
    0
);

scene.add(
    blueLight
);


const cyanLight =
    new THREE.PointLight(
        0x00eaff,
        150,
        700
    );

cyanLight.position.set(
    -200,
    100,
    100
);

scene.add(
    cyanLight
);


const whiteLight =
    new THREE.PointLight(
        0xffffff,
        90,
        500
    );

whiteLight.position.set(
    150,
    200,
    200
);

scene.add(
    whiteLight
);


/* =========================================================
   UNIVERSO
========================================================= */

const universe =
    new THREE.Group();

scene.add(
    universe
);


/* =========================================================
   ESTRELLAS
========================================================= */

function createStars(){

    const count =
        window.innerWidth < 700
        ? 1600
        : 3200;


    const positions =
        new Float32Array(
            count * 3
        );


    for(
        let i = 0;
        i < count;
        i++
    ){

        const radius =
            500 +
            Math.random() *
            1600;


        const theta =
            Math.random() *
            Math.PI *
            2;


        const phi =
            Math.acos(

                THREE.MathUtils.randFloat(
                    -1,
                    1
                )

            );


        positions[i * 3] =

            radius *
            Math.sin(phi) *
            Math.cos(theta);


        positions[i * 3 + 1] =

            radius *
            Math.cos(phi);


        positions[i * 3 + 2] =

            radius *
            Math.sin(phi) *
            Math.sin(theta);

    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )

    );


    const material =
        new THREE.PointsMaterial({

            color:
                0x9edcff,

            size:
                1.5,

            transparent:
                true,

            opacity:
                .8,

            sizeAttenuation:
                true

        });


    const stars =
        new THREE.Points(

            geometry,

            material

        );


    universe.add(
        stars
    );


    return stars;

}


const stars =
    createStars();

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

let selectedCar =
    null;


/* =========================================================
   ANIMACIÓN DE CÁMARA
========================================================= */

let cameraAnimation =
    null;


/* =========================================================
   AUTO ROTACIÓN
========================================================= */

let autoRotate =
    true;


/* =========================================================
   RELOJ
========================================================= */

const clock =
    new THREE.Clock();

let elapsed =
    0;


/* =========================================================
   ACTUALIZAR POSICIÓN DEL PUNTERO
========================================================= */

function updatePointer(event){

    let x;
    let y;


    if(
        event.touches &&
        event.touches.length > 0
    ){

        x =
            event.touches[0].clientX;

        y =
            event.touches[0].clientY;

    }else{

        x =
            event.clientX;

        y =
            event.clientY;

    }


    pointer.x =
        (x / window.innerWidth) * 2 - 1;


    pointer.y =
        -(y / window.innerHeight) * 2 + 1;

}


/* =========================================================
   BUSCAR AUTO BAJO EL PUNTERO
========================================================= */

function getCarFromPointer(){

    raycaster.setFromCamera(
        pointer,
        camera
    );


    const intersections =
        raycaster.intersectObjects(
            cars,
            true
        );


    for(
        const hit of intersections
    ){

        let object =
            hit.object;


        while(
            object &&
            !object.userData.isCar
        ){

            object =
                object.parent;

        }


        if(
            object &&
            object.userData.isCar
        ){

            return object;

        }

    }


    return null;

}


/* =========================================================
   SELECCIONAR AUTO
========================================================= */

function selectCar(){

    const car =
        getCarFromPointer();


    if(!car){

        return;

    }


    selectedCar =
        car;


    selectionName.textContent =
        car.userData.name;


    selectionType.textContent =
        car.userData.type;


    selection.classList.add(
        "show"
    );


    focusCar(
        car
    );

}


/* =========================================================
   ENFOCAR AUTO
========================================================= */

function focusCar(car){

    const target =
        car.getWorldPosition(
            new THREE.Vector3()
        );


    const direction =
        new THREE.Vector3(
            1,
            .45,
            1
        ).normalize();


    const destination =
        target.clone().add(
            direction.multiplyScalar(
                90
            )
        );


    animateCamera(
        destination,
        target
    );

}


/* =========================================================
   ANIMAR CÁMARA
========================================================= */

function animateCamera(
    destination,
    target
){

    cameraAnimation = {

        start:
            camera.position.clone(),

        end:
            destination.clone(),

        targetStart:
            controls.target.clone(),

        targetEnd:
            target.clone(),

        progress:
            0

    };

}


/* =========================================================
   RESET DE CÁMARA
========================================================= */

function resetCamera(){

    animateCamera(

        new THREE.Vector3(
            0,
            85,
            260
        ),

        new THREE.Vector3(
            0,
            0,
            0
        )

    );


    selectedCar =
        null;


    selection.classList.remove(
        "show"
    );

}


/* =========================================================
   BOTÓN AUTO
========================================================= */

autoButton.addEventListener(
    "click",
    () => {

        autoRotate =
            !autoRotate;


        autoButton.textContent =
            autoRotate
            ? "AUTO: ON"
            : "AUTO: OFF";

    }
);


/* =========================================================
   BOTÓN RESET
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        resetCamera();

    }
);


/* =========================================================
   CLICK DEL MOUSE
========================================================= */

renderer.domElement.addEventListener(
    "pointerup",
    event => {

        updatePointer(
            event
        );


        selectCar();

    }
);


/* =========================================================
   SOPORTE TOUCH
========================================================= */

renderer.domElement.addEventListener(
    "touchend",
    event => {

        if(
            event.changedTouches.length === 0
        ){

            return;

        }


        const touch =
            event.changedTouches[0];


        updatePointer({

            clientX:
                touch.clientX,

            clientY:
                touch.clientY

        });


        selectCar();

    },
    {
        passive:true
    }
);


/* =========================================================
   ANIMACIÓN PRINCIPAL
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    elapsed +=
        delta;


    /* =====================================================
       ESTRELLAS
    ===================================================== */

    stars.rotation.y +=
        delta * .002;


    stars.rotation.x =
        Math.sin(
            elapsed * .05
        ) * .02;


    /* =====================================================
       PARTÍCULAS
    ===================================================== */

    particles.rotation.y +=
        delta * .015;


    particles.rotation.x =
        Math.sin(
            elapsed * .03
        ) * .02;


    /* =====================================================
       ÓRBITAS
    ===================================================== */

    orbitGroups.forEach(
        (item, index) => {

            item.group.rotation.y +=
                delta *
                (
                    .015 +
                    index * .004
                );

        }
    );


    /* =====================================================
       NÚCLEO CENTRAL
    ===================================================== */

    const corePulse =
        1 +
        Math.sin(
            elapsed * 3
        ) * .12;


    core.scale.setScalar(
        corePulse
    );


    coreRing.rotation.z +=
        delta * .7;


    centralGlow.material.opacity =
        .55 +
        Math.sin(
            elapsed * 2
        ) * .15;


    /* =====================================================
       AUTOS
    ===================================================== */

    cars.forEach(
        car => {

            /* ---------------------------------------------
               MOVIMIENTO ORBITAL
            --------------------------------------------- */

            car.userData.angle +=
                delta *
                car.userData.speed;


            const angle =
                car.userData.angle;


            const radius =
                car.userData.radius;


            /* ---------------------------------------------
               POSICIÓN
            --------------------------------------------- */

            car.position.x =
                Math.cos(angle) *
                radius;


            car.position.z =
                Math.sin(angle) *
                radius;


            /* ---------------------------------------------
               MOVIMIENTO VERTICAL
            --------------------------------------------- */

            car.position.y =

                car.userData.originalY +

                Math.sin(
                    elapsed * 1.7 +
                    car.userData.phase
                ) * 2.5;


            /* ---------------------------------------------
               ORIENTACIÓN DEL AUTO
            --------------------------------------------- */

            car.rotation.y =
                -angle +
                Math.PI / 2;


            /* ---------------------------------------------
               PEQUEÑO BALANCEO
            --------------------------------------------- */

            car.rotation.z =
                Math.sin(
                    elapsed * 1.5 +
                    car.userData.phase
                ) * .025;


            car.rotation.x =
                Math.cos(
                    elapsed * 1.2 +
                    car.userData.phase
                ) * .018;


            /* ---------------------------------------------
               RUEDAS GIRANDO
            --------------------------------------------- */

            car.userData.wheels.forEach(
                wheel => {

                    wheel.rotation.x +=
                        delta * 8;

                }
            );


            /* ---------------------------------------------
               AUTO SELECCIONADO
            --------------------------------------------- */

            if(
                car === selectedCar
            ){

                const pulse =
                    1 +
                    Math.sin(
                        elapsed * 5
                    ) * .06;


                car.scale.setScalar(

                    car.userData.baseScale *
                    pulse

                );

            }else{

                car.scale.setScalar(

                    car.userData.baseScale

                );

            }

        }
    );


    /* =====================================================
       ANIMACIÓN DE CÁMARA
    ===================================================== */

    if(
        cameraAnimation
    ){

        cameraAnimation.progress +=
            delta * 1.7;


        const progress =
            Math.min(
                cameraAnimation.progress,
                1
            );


        /*
           Easing suave
        */

        const smooth =
            progress < .5

            ? 2 *
              progress *
              progress

            : 1 -
              Math.pow(
                  -2 * progress + 2,
                  2
              ) / 2;


        camera.position.lerpVectors(

            cameraAnimation.start,

            cameraAnimation.end,

            smooth

        );


        controls.target.lerpVectors(

            cameraAnimation.targetStart,

            cameraAnimation.targetEnd,

            smooth

        );


        if(
            progress >= 1
        ){

            cameraAnimation =
                null;

        }

    }


    /* =====================================================
       ROTACIÓN AUTOMÁTICA DEL UNIVERSO
    ===================================================== */

    if(
        autoRotate
    ){

        universe.rotation.y +=
            delta * .018;

    }


    /* =====================================================
       CONTROLES
    ===================================================== */

    controls.update();


    /* =====================================================
       RENDER
    ===================================================== */

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   INICIAR ANIMACIÓN
========================================================= */

animate();


/* =========================================================
   CARGADOR
========================================================= */

let loadingValue =
    0;


const loadingInterval =
    setInterval(
        () => {

            loadingValue +=
                Math.random() * 12 + 5;


            loadingValue =
                Math.min(
                    loadingValue,
                    100
                );


            loadingProgress.style.width =
                loadingValue + "%";


            if(
                loadingValue >= 100
            ){

                clearInterval(
                    loadingInterval
                );


                setTimeout(
                    () => {

                        loading.style.opacity =
                            "0";


                        setTimeout(
                            () => {

                                loading.style.display =
                                    "none";

                            },
                            700
                        );

                    },
                    350
                );

            }

        },
        120
    );


/* =========================================================
   INTRO CINEMÁTICA
========================================================= */

setTimeout(
    () => {

        intro.classList.add(
            "hidden"
        );

    },
    3000
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        renderer.setPixelRatio(

            Math.min(
                window.devicePixelRatio,
                2
            )

        );

    }
);


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        /* R = RESET */

        if(
            event.key.toLowerCase() === "r"
        ){

            resetCamera();

        }


        /* A = AUTO */

        if(
            event.key.toLowerCase() === "a"
        ){

            autoRotate =
                !autoRotate;


            autoButton.textContent =
                autoRotate
                ? "AUTO: ON"
                : "AUTO: OFF";

        }


        /* ESC = DESELECCIONAR */

        if(
            event.key === "Escape"
        ){

            selectedCar =
                null;


            selection.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   DOBLE CLICK = ENFOCAR CENTRO
========================================================= */

renderer.domElement.addEventListener(
    "dblclick",
    () => {

        resetCamera();

    }
);


/* =========================================================
   DETECCIÓN DE WEBGL
========================================================= */

function checkWebGL(){

    try{

        const testCanvas =
            document.createElement(
                "canvas"
            );


        const context =
            testCanvas.getContext(
                "webgl2"
            ) ||
            testCanvas.getContext(
                "webgl"
            );


        if(!context){

            throw new Error(
                "WebGL no está disponible."
            );

        }

    }catch(error){

        errorScreen.style.display =
            "flex";


        errorText.textContent =
            "Tu navegador o dispositivo no puede ejecutar WebGL. Prueba con Chrome, Edge o Firefox actualizado.";

    }

}


checkWebGL();


/* =========================================================
   MENSAJE DE ERROR SI THREE.JS FALLA
========================================================= */

window.addEventListener(
    "error",
    event => {

        console.error(
            "Error:",
            event.error || event.message
        );

    }
);


/* =========================================================
   DETECCIÓN DE PÉRDIDA DE CONTEXTO
========================================================= */

renderer.domElement.addEventListener(
    "webglcontextlost",
    event => {

        event.preventDefault();


        errorScreen.style.display =
            "flex";


        errorText.textContent =
            "Se perdió el contexto gráfico. Recarga la página para volver a iniciar el universo.";

    }
);


/* =========================================================
   EFECTO DE HOVER EN AUTOS
========================================================= */

renderer.domElement.addEventListener(
    "pointermove",
    event => {

        updatePointer(
            event
        );


        const car =
            getCarFromPointer();


        if(car){

            renderer.domElement.style.cursor =
                "pointer";

        }else{

            renderer.domElement.style.cursor =
                "grab";

        }

    }
);


/* =========================================================
   CAMBIAR CURSOR AL ARRASTRAR
========================================================= */

controls.addEventListener(
    "start",
    () => {

        renderer.domElement.style.cursor =
            "grabbing";

    }
);


controls.addEventListener(
    "end",
    () => {

        renderer.domElement.style.cursor =
            "grab";

    }
);

);
