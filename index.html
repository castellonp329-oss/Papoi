<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040c">
  <title>Hot Wheels Universe</title>
  <meta name="description" content="Experiencia 3D interactiva inspirada en un universo de Hot Wheels.">
  <style>
    :root{
      --cyan:#19bfff;--blue:#1477ff;--deep:#02040c;--glass:rgba(4,14,34,.56);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#01030a;transition:.9s ease}
    .loader.hide{opacity:0;pointer-events:none}
    .loader-box{text-align:center}
    .loader-logo{font-weight:950;font-style:italic;letter-spacing:.08em;font-size:clamp(28px,7vw,64px);
      color:#ff3b20;text-shadow:2px 2px 0 #ffc400,0 0 24px rgba(0,153,255,.9)}
    .loader-line{width:min(280px,65vw);height:2px;margin:22px auto 12px;background:rgba(22,178,255,.18);overflow:hidden}
    .loader-line i{display:block;width:35%;height:100%;background:#12b8ff;box-shadow:0 0 16px #12b8ff;animation:load 1.1s infinite}
    .loader-small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#7edcff}
    @keyframes load{from{transform:translateX(-110%)}to{transform:translateX(310%)}}

    .hud{position:fixed;inset:0;z-index:5;pointer-events:none}
    .top{position:absolute;top:22px;left:50%;transform:translateX(-50%);text-align:center;width:min(900px,94vw)}
    .top h1{margin:0;font-size:clamp(21px,4vw,48px);font-weight:950;letter-spacing:.045em;text-transform:uppercase;
      color:#21baff;text-shadow:0 0 7px #00aaff,0 0 26px #006cff,0 0 60px rgba(0,82,255,.9)}
    .top p{margin:7px 0 0;font-size:clamp(8px,1.1vw,12px);letter-spacing:.34em;color:#b8ecff;text-transform:uppercase}
    .hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;
      color:#a6dfff;text-transform:uppercase;background:rgba(1,8,22,.48);border:1px solid rgba(21,166,255,.3);
      padding:9px 14px;border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap}
    .panel{position:absolute;right:18px;top:18px;width:min(290px,82vw);padding:15px 16px;border-radius:16px;
      background:linear-gradient(180deg,rgba(5,18,43,.76),rgba(1,7,18,.52));border:1px solid rgba(31,179,255,.32);
      box-shadow:0 0 30px rgba(0,101,255,.16);backdrop-filter:blur(14px);opacity:0;transform:translateY(-10px);
      transition:.35s ease}
    .panel.show{opacity:1;transform:none}
    .panel .name{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#fff}
    .panel .meta{margin-top:5px;font-size:10px;color:#7edcff;letter-spacing:.12em;text-transform:uppercase}
    .panel button{margin-top:12px;border:1px solid #12aaff;background:rgba(0,123,255,.1);color:#bdeeff;
      border-radius:999px;padding:7px 11px;font-size:10px;cursor:pointer;pointer-events:auto}
    .panel button:hover{background:rgba(0,145,255,.24)}
    .controls{position:absolute;left:18px;top:18px;display:flex;gap:8px;pointer-events:auto}
    .controls button{border:1px solid rgba(27,174,255,.38);background:rgba(2,12,28,.5);color:#bdeeff;
      border-radius:999px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(8px);font-size:11px}
    .controls button:hover{background:rgba(0,119,255,.2)}
    .credit{position:absolute;right:20px;bottom:22px;font-size:9px;color:#4e8bad;letter-spacing:.12em;text-transform:uppercase}

    @media(max-width:650px){
      .panel{top:auto;bottom:60px;right:50%;transform:translate(50%,10px)}
      .panel.show{transform:translate(50%,0)}
      .controls{top:12px;left:12px}
      .top{top:68px}
      .credit{display:none}
      .hint{bottom:18px;font-size:8px}
    }
  </style>
</head>
<body>
<div id="app"></div>

<div class="loader" id="loader">
  <div class="loader-box">
    <div class="loader-logo">HOT WHEELS</div>
    <div class="loader-line"><i></i></div>
    <div class="loader-small">Entrando al universo</div>
  </div>
</div>

<div class="hud">
  <div class="controls">
    <button id="resetBtn">REINICIAR CÁMARA</button>
    <button id="autoBtn">AUTO: ON</button>
  </div>
  <div class="top">
    <h1>Feliz Día de los Hot Wheels</h1>
    <p>Un universo hecho de velocidad, recuerdos y pasión</p>
  </div>
  <div class="panel" id="panel">
    <div class="name" id="carName">Hot Wheels</div>
    <div class="meta" id="carMeta">Vehículo seleccionado</div>
    <button id="focusBtn">ACERCAR VEHÍCULO</button>
  </div>
  <div class="hint">Arrastra para explorar · rueda/pellizca para acercar · toca un carro</div>
  <div class="credit">Experiencia 3D · GitHub Pages</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";

const app = document.querySelector("#app");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x01030a);
scene.fog = new THREE.FogExp2(0x01030a, 0.0028);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 1800);
camera.position.set(0, 26, 92);

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.minDistance = 18;
controls.maxDistance = 210;
controls.maxPolarAngle = Math.PI*.78;
controls.target.set(0,0,0);

scene.add(new THREE.AmbientLight(0x214c88, .65));
const key = new THREE.DirectionalLight(0xa9ddff, 1.25);
key.position.set(-25,40,35); scene.add(key);
const cyan = new THREE.PointLight(0x008cff, 18, 180, 2);
cyan.position.set(0,8,0); scene.add(cyan);
const blue = new THREE.PointLight(0x003dff, 12, 150, 2);
blue.position.set(-70,-12,-40); scene.add(blue);

const universe = new THREE.Group();
scene.add(universe);

function makeStars(count=2600){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3), sizes = new Float32Array(count);
  for(let i=0;i<count;i++){
    const r = 180 + Math.random()*620, a=Math.random()*Math.PI*2, b=(Math.random()-.5)*Math.PI;
    pos[i*3]=Math.cos(a)*Math.cos(b)*r;
    pos[i*3+1]=Math.sin(b)*r*.62;
    pos[i*3+2]=Math.sin(a)*Math.cos(b)*r;
    sizes[i]=Math.random()*2.2+.4;
  }
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("size",new THREE.BufferAttribute(sizes,1));
  const mat = new THREE.PointsMaterial({color:0x73cfff,size:.9,sizeAttenuation:true,transparent:true,opacity:.82});
  scene.add(new THREE.Points(geo,mat));
}
makeStars();

function glowSprite(color=0x008cff, size=55){
  const c=document.createElement("canvas"); c.width=c.height=128;
  const x=c.getContext("2d"), g=x.createRadialGradient(64,64,0,64,64,64);
  const col=new THREE.Color(color), hex="#"+col.getHexString();
  g.addColorStop(0,"rgba(255,255,255,.9)");
  g.addColorStop(.08,hex);
  g.addColorStop(.35,hex+"99");
  g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.scale.set(size,size,size); return s;
}
for(let i=0;i<11;i++){
  const g=glowSprite(i%3?0x006cff:0x00baff, 22+Math.random()*55);
  const a=Math.random()*Math.PI*2,r=25+Math.random()*110;
  g.position.set(Math.cos(a)*r,(Math.random()-.5)*45,Math.sin(a)*r);
  universe.add(g);
}

function makeTextSprite(text){
  const c=document.createElement("canvas"); c.width=1024;c.height=180;
  const ctx=c.getContext("2d");
  ctx.font="900 54px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="#007dff";ctx.shadowBlur=20;ctx.fillStyle="#28bfff";ctx.fillText(text,512,90);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:.88}));
  sp.scale.set(18,3.15,1); return sp;
}
const phrases=["Esperanza","Meta","Mi paz","Libertad","Campanadas","Sueños","Familia","Amigos","Velocidad","Pasión","Diversión","Confianza","Aventura","Recuerdos","Amor","Sonríe","Camino","Único"];
for(let i=0;i<34;i++){
  const s=makeTextSprite(phrases[i%phrases.length]);
  const a=i/34*Math.PI*2+Math.random()*.45, r=35+Math.random()*70;
  s.position.set(Math.cos(a)*r,(Math.random()-.5)*34,Math.sin(a)*r);
  s.rotation.z=(Math.random()-.5)*.16;
  universe.add(s);
}

const carData=[
  ["Blaze Runner",0xff2b17,0xffc400],
  ["Blue Comet",0x087dff,0x00d7ff],
  ["Inferno GT",0xe9190a,0xff8b00],
  ["Neon Racer",0x00a8ff,0xffffff],
  ["Solar Flame",0xff4a00,0xffdc00],
  ["Midnight X",0x102a61,0x24baff],
  ["Turbo Strike",0xd20a0a,0xffca00],
  ["Electric Arrow",0x0b74ff,0x8eeeff]
];

const selectable=[];
const wheelGeo=new THREE.CylinderGeometry(.52,.52,.30,24);
wheelGeo.rotateZ(Math.PI/2);

function createCar(name, bodyColor, stripeColor){
  const g=new THREE.Group();
  g.userData={isCar:true,name,baseY:0,spin:Math.random()*.8};
  const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,metalness:.38,roughness:.26});
  const darkMat=new THREE.MeshStandardMaterial({color:0x05070c,metalness:.35,roughness:.3});
  const chrome=new THREE.MeshStandardMaterial({color:0xbdd6e6,metalness:.8,roughness:.18});
  const stripeMat=new THREE.MeshStandardMaterial({color:stripeColor,emissive:stripeColor,emissiveIntensity:.16,metalness:.25,roughness:.3});

  const base=new THREE.Mesh(new THREE.BoxGeometry(5.9,1.05,2.55),bodyMat);
  base.position.y=.65;base.scale.set(1,.95,1);g.add(base);

  const hood=new THREE.Mesh(new THREE.BoxGeometry(2.0,.42,2.35),bodyMat);
  hood.position.set(2.05,1.18,0);g.add(hood);

  const rear=new THREE.Mesh(new THREE.BoxGeometry(1.4,.52,2.4),bodyMat);
  rear.position.set(-2.15,1.03,0);g.add(rear);

  const cabin=new THREE.Mesh(new THREE.CapsuleGeometry(1.05,.95,6,16),darkMat);
  cabin.scale.set(1.15,.62,1.0);cabin.position.set(-.45,1.58,0);g.add(cabin);

  const windshield=new THREE.Mesh(new THREE.BoxGeometry(.72,.04,1.65),new THREE.MeshStandardMaterial({color:0x1ca9dc,transparent:true,opacity:.38,metalness:.6,roughness:.12}));
  windshield.position.set(.18,1.72,0);windshield.rotation.z=-.42;g.add(windshield);

  const stripe=new THREE.Mesh(new THREE.BoxGeometry(5.55,.035,.36),stripeMat);
  stripe.position.set(.05,1.22,.01);g.add(stripe);

  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(.22, .6, 2.7),bodyMat);
  spoiler.position.set(-2.9,1.45,0);g.add(spoiler);
  const spoilerBar=new THREE.Mesh(new THREE.BoxGeometry(.9,.16,2.9),bodyMat);
  spoilerBar.position.set(-2.9,1.72,0);g.add(spoilerBar);

  [-1.85,1.85].forEach(x=>{
    [-1.35,1.35].forEach(z=>{
      const w=new THREE.Mesh(wheelGeo,darkMat);w.position.set(x,.38,z);g.add(w);
      const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.32,16),chrome);
      hub.rotation.z=Math.PI/2;hub.position.set(x,.38,z);g.add(hub);
    });
  });

  const headMat=new THREE.MeshStandardMaterial({color:0xeaffff,emissive:0x68dfff,emissiveIntensity:5});
  [-.76,.76].forEach(z=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(.28,.18,.42),headMat);l.position.set(2.94,1.0,z);g.add(l);
  });
  const tailMat=new THREE.MeshStandardMaterial({color:0xff1600,emissive:0xff0800,emissiveIntensity:3});
  [-.76,.76].forEach(z=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.42),tailMat);l.position.set(-2.94,1.0,z);g.add(l);
  });

  const logo=makeTextSprite("HOT WHEELS");
  logo.scale.set(3.2,.56,1);logo.position.set(.2,1.25,1.31);logo.rotation.y=Math.PI;
  g.add(logo);

  const halo=glowSprite(stripeColor,9);halo.position.y=.2;g.add(halo);
  g.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false}});
  selectable.push(g);
  return g;
}

const ring=new THREE.Group();
universe.add(ring);
const radius=54;
for(let i=0;i<28;i++){
  const d=carData[i%carData.length], car=createCar(...d);
  const a=i/28*Math.PI*2;
  const r=radius+(i%4-1.5)*9;
  car.position.set(Math.cos(a)*r,(Math.sin(i*1.9)*9)+(i%3-1)*3,Math.sin(a)*r);
  car.rotation.y=-a+Math.PI/2;
  car.scale.setScalar(.72+(i%5)*.07);
  car.userData.orbitRadius=r;
  car.userData.angle=a;
  car.userData.speed=.025+(i%7)*.003;
  ring.add(car);
}

const centerRing=new THREE.Mesh(
  new THREE.TorusGeometry(14,.08,8,160),
  new THREE.MeshBasicMaterial({color:0x008cff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending})
);
centerRing.rotation.x=Math.PI/2;universe.add(centerRing);

const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
let selected=null, auto=true, focusTarget=null;

function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(selectable,true);
  if(!hits.length)return;
  let o=hits[0].object;
  while(o && !o.userData.isCar)o=o.parent;
  if(o) selectCar(o);
}
renderer.domElement.addEventListener("pointerdown",pick);

function selectCar(car){
  selected=car; focusTarget=car;
  document.querySelector("#carName").textContent=car.userData.name;
  document.querySelector("#carMeta").textContent="Vehículo seleccionado · toca para enfocar";
  document.querySelector("#panel").classList.add("show");
  selectable.forEach(c=>c.scale.multiplyScalar(c===car?1.05:1));
}

function focusSelected(){
  if(!selected)return;
  const p=selected.getWorldPosition(new THREE.Vector3());
  controls.target.lerp(p,.8);
  const dir=new THREE.Vector3().subVectors(camera.position,p).normalize();
  camera.position.copy(p.clone().add(dir.multiplyScalar(15)).add(new THREE.Vector3(0,5,0)));
}

document.querySelector("#focusBtn").onclick=focusSelected;
document.querySelector("#resetBtn").onclick=()=>{
  camera.position.set(0,26,92);controls.target.set(0,0,0);selected=null;
  document.querySelector("#panel").classList.remove("show");
};
document.querySelector("#autoBtn").onclick=e=>{
  auto=!auto;e.currentTarget.textContent="AUTO: "+(auto?"ON":"OFF");
};

let t0=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-t0)/1000);t0=now;

  if(auto){
    ring.rotation.y += dt*.035;
    centerRing.rotation.z += dt*.14;
  }
  selectable.forEach((car,i)=>{
    const wobble=Math.sin(now*.0012+i)*.06;
    car.position.y += (wobble-(car.userData.wobble||0))*.08;
    car.userData.wobble=wobble;
    car.rotation.z=Math.sin(now*.0008+i)*.025;
    if(selected===car) car.rotation.y+=dt*.35;
  });

  if(focusTarget){
    const p=focusTarget.getWorldPosition(new THREE.Vector3());
    controls.target.lerp(p,.025);
  }
  controls.update();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
setTimeout(()=>document.querySelector("#loader").classList.add("hide"),1800);
</script>
</body>
  </html>
